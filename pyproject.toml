[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nr2grafana"
version = "1.0.0"
description = "Convert New Relic dashboards to Grafana (LGTM stack) dashboards: NRQL -> PromQL/LogQL/TraceQL, batch fetch and convert"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
nr2grafana = "nr2grafana.cli:main"
n2g = "nr2grafana.cli:main"
g2n = "nr2grafana.cli:main"

[tool.setuptools.packages.find]
include = ["nr2grafana*"]
